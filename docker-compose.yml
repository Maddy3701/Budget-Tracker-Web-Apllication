version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: budget_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: budget_tracker
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: budget_backend
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/budget_tracker
      JWT_SECRET: change_this_in_production
      JWT_EXPIRES: 7d
      CLIENT_URL: http://localhost:5500
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: budget_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data: